name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Configure o secret NPM_TOKEN (read:packages em @printrio-tech)."
            exit 1
          fi
          printf '%s\n' \
            '@printrio-tech:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            'always-auth=true' > .npmrc

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          GITHUB_PAGES: 'true'
          # BFF print-imprensa-back DEV (VPS, stack print-imprensa-dev). Override via repo variable VITE_GRAPHQL_URL.
          VITE_GRAPHQL_URL: ${{ vars.VITE_GRAPHQL_URL || 'https://imprensa-dev.187-127-44-1.sslip.io/graphql' }}

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
